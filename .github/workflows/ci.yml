name: CI
on:
  pull_request:
  push:
    branches: [main, master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull Vercel production settings
        run: pnpm dlx vercel@59.23.2 pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Build production artifact
        run: pnpm dlx vercel@59.23.2 build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Deploy production artifact
        id: deploy
        run: |
          DEPLOYMENT_URL="$(pnpm dlx vercel@59.23.2 deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=${DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"
      - name: Ensure product subdomains are bound
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set +e
          project_domains="$(curl --fail-with-body --silent --show-error \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}&limit=100" \
            --header "Authorization: Bearer ${VERCEL_TOKEN}")"
          for domain in \
            typhoon.xihuresponse.top plan.xihuresponse.top command.xihuresponse.top \
            resource.xihuresponse.top inventory.xihuresponse.top risk.xihuresponse.top \
            city.xihuresponse.top duty.xihuresponse.top data.xihuresponse.top \
            review.xihuresponse.top admin.xihuresponse.top; do
            if jq --exit-status --arg domain "$domain" '.domains[] | select(.name == $domain)' <<< "$project_domains" >/dev/null 2>&1; then
              echo "$domain is already bound"
            else
              curl --fail-with-body --silent --show-error \
                --request POST \
                "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/domains?teamId=${VERCEL_ORG_ID}" \
                --header "Authorization: Bearer ${VERCEL_TOKEN}" \
                --header "Content-Type: application/json" \
                --data "{\"name\":\"${domain}\"}" >/dev/null 2>&1 \
                && echo "$domain was bound" || echo "$domain bind skipped (already exists or transient error)"
            fi
          done
          exit 0
      - name: Update canonical production domain
        run: pnpm dlx vercel@59.23.2 alias set "${{ steps.deploy.outputs.url }}" xihu-emergency-management-platform.vercel.app --token="${{ secrets.VERCEL_TOKEN }}"
