name: 问题报告
description: 报告可以稳定复现的功能、数据或界面问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 请勿提交账号、邀请码、密钥、真实个人信息或未脱敏业务数据。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么？你原本期望什么？
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 所属模块
      options:
        - 统一登录与综合门户
        - 台汛卫士
        - 预案中心
        - 指挥调度
        - 应急资源
        - 物资库存
        - 风险普查
        - 城市安全
        - 应急值班
        - 数据管理
        - 灾后复盘
        - 后台管理
        - 部署与基础设施
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 使用 member 角色登录
        2. 进入……
        3. 点击……
        4. 出现……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 线上或本地、操作系统、浏览器及版本
      placeholder: 线上 / macOS / Chrome 版本号
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏截图或日志
      description: 删除邮箱、令牌、邀请码、人员姓名和真实业务数据后再上传。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我没有提交任何密钥、邀请码或敏感数据。
          required: true
